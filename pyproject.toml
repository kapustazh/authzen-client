[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "authzen-client"
version = "0.1.0"
description = "A typed Python client for the AuthZEN Authorization API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
oauth = [
    "httpx-auth>=0.23.1,<1",
]

[dependency-groups]
dev = [
    "httpx-auth>=0.23.1,<1",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
strict = true
