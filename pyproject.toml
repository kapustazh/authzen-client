[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "authzen-client"
version = "0.2.0"
description = "A typed Python client for the AuthZEN Authorization API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.2,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
oauth = [
    "authlib>=1.9.8,<2",
]

[dependency-groups]
dev = [
    "authlib>=1.9.8,<2",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
    "types-authlib>=1.8.0.20261106",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
strict = true
