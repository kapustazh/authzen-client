[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "authzen-client"
version = "0.2.0"
description = "A typed Python client for the AuthZEN Authorization API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx2>=2.16.2,<3",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
oauth = [
    "authlib>=1.9.8,<2",
]

[project.urls]
Repository = "https://github.com/kapustazh/authzen-client"
Documentation = "https://github.com/kapustazh/authzen-client/tree/main/docs"
Issues = "https://github.com/kapustazh/authzen-client/issues"

[dependency-groups]
dev = [
    "authlib>=1.9.8,<2",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
    "ty>=0.0.105",
    "types-authlib>=1.8.0.20261106",
]
docs = [
    "zensical>=0.1.1,<0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
return-type-inference = "always"
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true
