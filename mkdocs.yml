site_name: AuthZEN Client
site_description: Typed Python SDK for the AuthZEN Authorization API
repo_url: https://github.com/kapustazh/authzen-client
repo_name: kapustazh/authzen-client
theme:
  name: material
  palette:
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Get started:
      - Introduction: index.md
      - Quickstart: quickstart.md
  - Guides:
      - Sync and async: clients.md
      - Batch evaluations: batch.md
      - Search and pagination: search.md
      - Authentication: authentication.md
  - Advanced:
      - Configuration and discovery: configuration.md
      - Errors: errors.md
  - Reference:
      - API: api.md
      - Migration: migration.md
      - Development: development.md
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
plugins:
  - search
